# Runtime Garden Social Studio — local dev stack
#
# Usage:
#   cp .env.example .env   # then edit the two required values below
#   docker compose up
#   docker compose exec web node tools/seed-fixtures.cjs /app/data/studio.sqlite
#
# No secrets belong in this file. All secrets stay in .env (gitignored).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      RG_HOST: 0.0.0.0
    ports:
      # Host port maps to the same container port the app actually binds
      # (RG_PORT from .env), so a custom RG_PORT keeps working.
      - "${RG_PORT:-8787}:${RG_PORT:-8787}"
    volumes:
      - studio-data:/app/data
    restart: unless-stopped

volumes:
  studio-data:
